<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-label="Illustrative cross-section mesh regions: fuel, gap, sheath, coolant">
<title>Illustrative cross-section mesh regions: fuel, gap, sheath, coolant</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d2a3a}.heading{font-weight:700;font-size:22px}.label{font-size:15px}.small{font-size:12px;fill:#526174}</style>
<text class="heading" x="34" y="40">Defective fuel element: teaching geometry</text>
<text class="small" x="34" y="62">Schematic only; dimensions are normalized exercise values, not CANDU measurements.</text>
<polygon points="510.0,143.8 300.0,22.5 90.0,143.8 90.0,386.2 300.0,507.5 510.0,386.2" fill="#dbeefa" stroke="#2870a5" stroke-width="3"/>
<circle cx="300" cy="265" r="144.0" fill="#9ea6b0" stroke="#414c5c" stroke-width="2"/>
<circle cx="300" cy="265" r="126.0" fill="#f2c46e" stroke="#9e6712" stroke-width="2"/>
<circle cx="300" cy="265" r="120.0" fill="#ea8d6a" stroke="#9f3d27" stroke-width="2"/>
<circle cx="300" cy="265" r="4" fill="#8e2c22"/>
<path d="M 300 121 L 300 93 M 291 107 L 309 107" stroke="#c52232" stroke-width="5" stroke-linecap="round"/>
<path d="M 407 203 L 576 158" stroke="#9f3d27" stroke-width="2" fill="none"/>
<circle cx="407" cy="203" r="4" fill="#9f3d27"/>
<text class="label" x="590" y="165">Fuel pellet</text>
<text class="small" x="590" y="184">r &lt; 0.40</text>
<path d="M 423 222 L 576 233" stroke="#9e6712" stroke-width="2" fill="none"/>
<circle cx="423" cy="222" r="4" fill="#9e6712"/>
<text class="label" x="590" y="240">Fuel-to-sheath gap</text>
<text class="small" x="590" y="259">0.40 - 0.42</text>
<path d="M 443 265 L 576 308" stroke="#414c5c" stroke-width="2" fill="none"/>
<circle cx="443" cy="265" r="4" fill="#414c5c"/>
<text class="label" x="590" y="315">Sheath</text>
<text class="small" x="590" y="334">0.42 - 0.48</text>
<path d="M 480 341 L 576 383" stroke="#2870a5" stroke-width="2" fill="none"/>
<circle cx="480" cy="341" r="4" fill="#2870a5"/>
<text class="label" x="590" y="390">Coolant cell</text>
<text class="small" x="590" y="409">outside r = 0.48</text>
<text class="small" x="34" y="518">The red mark indicates a possible defect location. The mesh input does not model a breach.</text>
</svg>
